# cargo-mutants settings for `xtask review mutants` (harness phase 3).

# Use the optimised `mutants` profile of Cargo.toml, so that the baseline
# test run fits the timeout.
profile = "mutants"

# cargo-mutants tests a mutated package with its default features only.  So
# code behind engine's `cpal` and synth's `files` would show as missed.
all_features = true

# These files compile for wasm32 only.  No native test can catch a mutant
# in them.  Each pattern names a whole file.
exclude_globs = [
    "app/src/decode_tests.rs",
    "app/src/decoder/client.rs",
    "app/src/picker.rs",
    "app/src/playback.rs",
    "app/src/playback_tests.rs",
    "app/src/save_tests.rs",
    "app/src/separator.rs",
    "app/src/store.rs",
    "app/src/streamtest.rs",
    "decoder/src/web.rs",
    "decoder/src/web/**",
    "worker/src/web.rs",
    "worker/src/web/**",
]

# A function, impl or module that compiles for wasm32 only, in a file that
# native code also uses, has `#[cfg_attr(mutants, mutants::skip)]`.
# cargo-mutants then makes no mutant of it, struct-field deletions
# included.  Put the attribute on each new wasm32-only function, impl or
# module.  Do not put it on a function with a native variant, such as
# `base_latency` in engine/src/live.rs, `main` in app/src/main.rs and
# `mapped_floats` in roformer-gpu/src/lib.rs.  The validator decides their
# wasm32 mutants.  A wasm32 block inside a shared function stays in too
# (TD-33).
