[package]
name = "stem-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Messages between the web app's page and its separation worker"

[dependencies]
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["Blob"] }

# Browser tests (`xtask web-test`); the version moves with wasm-bindgen's.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.79"

[lints]
workspace = true
