[package]
name = "stem-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Messages between the web app's page and its workers"

[dependencies]
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
web-sys = { version = "0.3.107", features = ["Blob", "Url"] }

# Browser tests (`xtask web-test`); the version moves with wasm-bindgen's.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"

[lints]
workspace = true
