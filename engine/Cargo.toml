[package]
name = "engine"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1"
cpal = { version = "0.18.2", optional = true }
cute-dsp = { version = "0.0.41", optional = true }
dsp = { version = "0.1.0", path = "../dsp" }
realfft = "3.5.0"
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "wav", "pcm"] }
timestretch = { version = "0.15.0", optional = true }
web-time = "1.1.0"
wsola = { version = "0.1.0", optional = true }

[features]
default = ["stretch-timestretch", "stretch-wsola", "stretch-cute"]
stretch-wsola = ["dep:wsola"]
stretch-timestretch = ["dep:timestretch"]
stretch-cute = ["dep:cute-dsp"]
cpal = ["dep:cpal"]

[lints]
workspace = true
