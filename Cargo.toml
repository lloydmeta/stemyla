[workspace]
resolver = "3"
members = ["dsp", "engine", "app", "xtask", "synth", "roformer", "roformer-gpu", "worker"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1

[workspace.lints.clippy]
# Index loops over several parallel buffers read more clearly in DSP code.
needless_range_loop = "allow"

# Web build without debug info, used by app/index.html.  Adding
# `lto = "thin"` shrinks the bundle further where the wasm32 standard
# library ships with bitcode (a rustup-installed target does).
[profile.web-release]
inherits = "release"
debug = false
codegen-units = 4
