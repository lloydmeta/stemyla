[workspace]
resolver = "3"
members = ["dsp", "engine", "app", "xtask", "synth", "roformer", "roformer-gpu", "worker", "decoder", "protocol", "test-support"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
debug = 1

# The build of `xtask review mutants` (`.cargo/mutants.toml`).  Without
# optimisation the DSP tests are slow, and the baseline test run timed out at
# 300 s (TD-33).  It inherits the test profile, so debug assertions and
# overflow checks stay on.
[profile.mutants]
inherits = "test"
opt-level = 2
debug = false

# cargo-mutants reads `#[cfg_attr(mutants, mutants::skip)]` from the
# source.  No build sets `cfg(mutants)`, so the build needs no `mutants`
# crate.  This entry stops the warning for the unknown cfg (TD-33).
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(mutants)'] }

[workspace.lints.clippy]
# Index loops over several parallel buffers read more clearly in DSP code.
needless_range_loop = "allow"

# Reading fixed-size byte groups with `chunks_exact(N)` is the idiomatic way to
# parse little-endian values; `as_chunks` is newer and no clearer here.
chunks_exact_to_as_chunks = "allow"

# Web build without debug info, used by app/index.html.  Adding
# `lto = "thin"` shrinks the bundle further where the wasm32 standard
# library ships with bitcode (a rustup-installed target does).
[profile.web-release]
inherits = "release"
debug = false
codegen-units = 4
