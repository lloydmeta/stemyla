[package]
name = "stem-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Web Worker that runs BS-RoFormer SW on WebGPU for the web app"

# Only meaningful on wasm32; natively `main` is empty so that
# `cargo test --workspace` still builds.

[target.'cfg(target_arch = "wasm32")'.dependencies]
roformer = { path = "../roformer", default-features = false }
roformer-gpu = { path = "../roformer-gpu" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "webgpu"] }
console_error_panic_hook = "0.1.7"
half = "2.7.1"
safetensors = "0.7.0"
# MP3 encoder for stem downloads: pure Rust, Apache-2.0.  Pinned: a young
# crate (first released October 2026), so updates are taken deliberately.
rusty_mp3 = "=1.0.0"
# FLAC encoder for stem downloads: pure Rust, Apache-2.0, without its
# threads (`par`).  Pinned: below 1.0, and its API changes with each minor
# version (DEPS-1).  It writes 16 bits well, but not 24.
flacenc = { version = "=0.5.1", default-features = false }
# Writes the ALAC M4A of a save: the head, the packets and their table.
# A workspace crate, Apache-2.0 only (decision 0029).
m4a = { path = "../m4a" }
stem-protocol = { path = "../protocol" }
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Blob", "BlobPropertyBag", "DedicatedWorkerGlobalScope", "MessageEvent", "console"] }

# Browser tests (`xtask web-test`); the version moves with wasm-bindgen's.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
# Fails a GPU skip when the build has STEMYLA_REQUIRE=gpu (VERIFY-1).
test-support = { path = "../test-support" }
# Decodes the worker's FLAC and M4A in its tests, so a second
# implementation checks the output of flacenc, of `m4a` and of the
# browser's AAC encoder.
symphonia = { version = "0.6.1", default-features = false, features = ["flac", "isomp4", "alac", "aac"] }

[lints]
workspace = true
