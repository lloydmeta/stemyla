[package]
name = "m4a"
version = "0.1.0"
edition.workspace = true
# The ALAC encoder is a port of `alac-encoder` 0.3.0, which is a port of
# Apple's ALAC reference.  Apple's reference is Apache-2.0 only, so this
# crate is Apache-2.0 only (decision 0029).
license = "Apache-2.0"

[dependencies]

# The reference of the ALAC port: a differential test checks that the port
# and this crate give the same packets.  A test-only crate; it does not
# ship.  It has had no release since 0.3.0 of January 2022, so DEPS-1's
# "maintained" does not hold.  It is a frozen reference: pinned exactly
# (below 1.0), test-only, never shipped and never updated.
[dev-dependencies]
alac-encoder = "=0.3.0"
# Decodes each test file bit for bit: a round trip of the writer.  The
# version of `engine/Cargo.toml`.  A test-only crate; it does not ship.
symphonia = { version = "0.6.1", default-features = false, features = ["isomp4", "alac"] }

[lints]
workspace = true
