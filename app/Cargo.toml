[package]
name = "app"
version = "0.1.0"
edition.workspace = true

[features]
default = ["audio"]
# Real audio output through cpal.  Without it the app plays silently.
audio = ["engine/cpal"]
# The browser tests' write worker: a page-side fake that writes with write
# streams, since the test runner serves no worker build (M5.1 of
# `docs/plans/active/gpu-speed.md`).  `xtask web-test` turns it on for the
# app's crate run; the shipped page never does.
fake-writer = []

[dependencies]
anyhow = "1"
dsp = { path = "../dsp" }
log = "0.4.34"
# The app only needs the default stretcher; the others stay in the bench.
engine = { path = "../engine", default-features = false, features = ["stretch-wsola"] }
synth = { path = "../synth" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Native: eframe's defaults (wgpu renderer, x11, wayland, accesskit).
eframe = "0.36.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Web: the glow (WebGL2) renderer is much smaller than wgpu, and keeps wgpu
# free for other uses.
eframe = { version = "0.36.2", default-features = false, features = ["glow", "default_fonts"] }
# cpal's Web Audio backend needs its wasm-bindgen feature.
cpal = { version = "0.18.2", features = ["wasm-bindgen"] }
stem-protocol = { path = "../protocol" }
console_error_panic_hook = "0.1.7"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
web-sys = { version = "0.3.107", features = ["Window", "Document", "Element", "HtmlCanvasElement", "Performance", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "HtmlInputElement", "FileList", "File", "Blob", "Location", "Event", "Navigator", "StorageManager", "ErrorEvent"] }

# Makes the M4A files of the tests of the head check: every test that
# needs an M4A uses this writer (TD-52).
[dev-dependencies]
m4a = { version = "0.1.0", path = "../m4a" }

# The UI tests render natively through wgpu.
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
egui_kittest = { version = "=0.36.2", features = ["eframe", "snapshot", "wgpu"] }
# dropping_several_files_loads_them_as_stems writes the demo song as WAV files.
synth = { path = "../synth", features = ["files"] }

# Browser tests (`xtask web-test`); the version moves with wasm-bindgen's.
[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.80"
# Makes the FLAC source of a stored session.  Pinned: below 1.0, and its
# API changes with each minor version (DEPS-1).
flacenc = { version = "=0.5.1", default-features = false }

[lints]
workspace = true
