<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Trunk sets href to the public URL (a build's own folder when published), so relative URLs such as the worker's resolve there. -->
  <base data-trunk-public-url />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>[stemyla] Stem explorer</title>
  <link rel="icon" href="data:,">
  <link data-trunk rel="rust" data-bin="app" data-wasm-opt="z" data-cargo-profile="web-release" data-integrity="none" />
  <!-- Stem separation worker: BS-RoFormer SW on WebGPU (worker/, roformer-gpu/). -->
  <link data-trunk rel="rust" href="../worker/Cargo.toml" data-bin="stem-worker" data-type="worker" data-bindgen-target="web" data-loader-shim data-integrity="none" data-wasm-opt="z" data-cargo-profile="web-release" />
  <!-- Safari puts Web Audio in the "ambient" audio session by default, which
       Silent Mode on an iPhone mutes.  "playback" plays through it, as media
       does.  Set before the app creates its AudioContext, and again on
       pageshow (a page restored from the back-forward cache, or after
       WebKit's GPU process restarted, can fall back to ambient). -->
  <script>
    (function () {
      function playback() {
        try {
          if (navigator.audioSession) {
            navigator.audioSession.type = "auto";
            navigator.audioSession.type = "playback";
          }
        } catch (e) {
          console.warn("audioSession", e);
        }
      }
      playback();
      addEventListener("pageshow", playback);
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="stem_explorer"></canvas>
</body>
</html>
