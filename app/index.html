<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Trunk sets href to the public URL (a build's own folder when published), so relative URLs such as the worker's resolve there. -->
  <base data-trunk-public-url />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Search and share tags.  `xtask brand` draws the icons and og.png into assets/.  `xtask publish` puts og.png at the site's root.  The test `the_head_tags_agree` keeps each repeated value equal. -->
  <title>Stemyla: split any song into stems in your browser</title>
  <meta name="description" content="Split any song into vocals, drums, bass, guitar, piano and the rest, in your browser with WebGPU. Free, private, no install: it all stems from your own GPU.">
  <link rel="canonical" href="https://beachape.com/stemyla/">
  <meta name="theme-color" content="#1b1b1b">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Stemyla">
  <meta property="og:url" content="https://beachape.com/stemyla/">
  <meta property="og:title" content="Stemyla: split any song into stems in your browser">
  <meta property="og:description" content="Split any song into vocals, drums, bass, guitar, piano and the rest, in your browser with WebGPU. Free, private, no install: it all stems from your own GPU.">
  <meta property="og:image" content="https://beachape.com/stemyla/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="A song's mix waveform splitting into six coloured stem lanes">
  <meta name="twitter:card" content="summary_large_image">
  <!-- Relative icon URLs resolve against the base: the build's own folder. -->
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link data-trunk rel="copy-file" href="assets/icon.svg" />
  <link data-trunk rel="copy-file" href="assets/favicon.ico" />
  <link data-trunk rel="copy-file" href="assets/apple-touch-icon.png" />
  <link data-trunk rel="copy-file" href="assets/og.png" />
  <link data-trunk rel="rust" data-bin="app" data-wasm-opt="z" data-cargo-profile="web-release" data-integrity="none" />
  <!-- Stem separation worker: BS-RoFormer SW on WebGPU (worker/, roformer-gpu/). -->
  <link data-trunk rel="rust" href="../worker/Cargo.toml" data-bin="stem-worker" data-type="worker" data-bindgen-target="web" data-loader-shim data-integrity="none" data-wasm-opt="z" data-cargo-profile="web-release" />
  <!-- Decode worker: decodes a stored song in blocks into browser storage (decoder/, decision 0019). -->
  <link data-trunk rel="rust" href="../decoder/Cargo.toml" data-bin="decode-worker" data-type="worker" data-bindgen-target="web" data-loader-shim data-integrity="none" data-wasm-opt="z" data-cargo-profile="web-release" />
  <!-- Write worker: writes the page's song-sized files through sync access handles (writer/, TD-103). -->
  <link data-trunk rel="rust" href="../writer/Cargo.toml" data-bin="write-worker" data-type="worker" data-bindgen-target="web" data-loader-shim data-integrity="none" data-wasm-opt="z" data-cargo-profile="web-release" />
  <!-- Safari puts Web Audio in the "ambient" audio session by default, which
       Silent Mode on an iPhone mutes.  "playback" plays through it, as media
       does.  Set before the app creates its AudioContext, and again on
       pageshow (a page restored from the back-forward cache, or after
       WebKit's GPU process restarted, can fall back to ambient). -->
  <script>
    (function () {
      function playback() {
        try {
          if (navigator.audioSession) {
            navigator.audioSession.type = "auto";
            navigator.audioSession.type = "playback";
          }
        } catch (e) {
          console.warn("audioSession", e);
        }
      }
      playback();
      addEventListener("pageshow", playback);
    })();
  </script>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1b1b1b; }
    canvas { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <canvas id="stem_explorer"></canvas>
</body>
</html>
