# MEM-1 (docs/invariants.md).  Clippy reads only this file for this crate.
# Each path has a canary: `mem1_lint_is_on` in `synth/src/lib.rs`.  The web
# app makes the demo song with this crate, so a copy of a stem stays in its
# wasm memory.
disallowed-methods = [
  { path = "slice::to_vec", reason = 'MEM-1: a copy of a song- or model-sized buffer stays in wasm memory for good.  Fix: borrow the slice, or move the buffer instead of copying it.  For a needed copy, add #[expect(clippy::disallowed_methods, reason = "MEM-1: why")] to its statement, field or match arm.' },
]
