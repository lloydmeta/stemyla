  <!-- Stem separation worker: BS-RoFormer SW on WebGPU (worker/, roformer-gpu/). -->
  
  <!-- Decode worker: decodes a stored song in blocks into browser storage (decoder/, decision 0019). -->
  
  <!-- Safari puts Web Audio in the "ambient" audio session by default, which
       Silent Mode on an iPhone mutes.  "playback" plays through it, as media
       does.  Set before the app creates its AudioContext, and again on
       pageshow (a page restored from the back-forward cache, or after
       WebKit's GPU process restarted, can fall back to ambient). -->
  <script>
    (function () {
      function playback() {
        try {
          if (navigator.audioSession) {
            navigator.audioSession.type = "auto";
            navigator.audioSession.type = "playback";
          }
        } catch (e) {
          console.warn("audioSession", e);
        }
      }
      playback();
      addEventListener("pageshow", playback);
    })();
  </script>
