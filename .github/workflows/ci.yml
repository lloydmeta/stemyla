name: CI

# Pull requests are gated on formatting, clippy, tests, the web build and
# the browser tests.
# A push to main re-runs those gates and, only if they all pass, publishes
# the site to the gh-pages branch with `xtask publish`.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default; the publish job widens this for itself.
permissions:
  contents: read

# Cancel superseded runs for the same pull request, but let main (and any
# in-flight publish) finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Pinned so CI matches the local toolchain and clippy/rustfmt results do
  # not drift when a new stable is released.  Bump deliberately.
  RUST_VERSION: "1.99.0"
  TRUNK_VERSION: "0.22.1"
  TRUNK_SHA256: "2ab8d548fd5ed9cda50906f61fd8654204e7893bd52ebbfd90533862b7d71ee1"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A new key, so the cache saves the wasm32 output too: rust-cache
          # saves only when the key it restored does not match exactly.
          key: wasm32
      - name: Install ALSA headers (cpal links libasound on Linux)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      # --all-targets compiles roformer-gpu and every test target, so clippy
      # is also the native compile gate for the GPU crate.  It also checks
      # the MEM-3 canary and the native MEM-1 canaries.
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # The web code compiles only for wasm32, so the native steps never lint
      # it (MEM-1).  The step does not name roformer or roformer-gpu.
      # roformer has no wasm32-only code.  Its default features and its
      # dev-dependencies pull burn, and so getrandom, which does not build
      # for wasm32.  roformer-gpu's wasm32-only code (mapped_floats) is
      # linted through stem-worker, which depends on it.  Its tests run
      # natively.
      - run: cargo clippy --locked --target wasm32-unknown-unknown -p app -p stem-worker -p decode-worker -p stem-protocol -p engine --all-targets -- -D warnings
      # --workspace merges features across crates: xtask turns on synth's
      # files feature for every crate in the build.  These steps check each
      # crate without that merge (LAYER-1, decision 0004).
      # synth without its files feature, as the web app takes it.
      - run: cargo clippy --locked -p synth --all-targets -- -D warnings
      # app's lib and binary without files: a native-only call to a writer
      # fails here.  The first -p app step checks about 90 dependencies again.
      - run: cargo clippy --locked -p app -- -D warnings
      # app's tests, which take files only through their own dev-dependency:
      # a lost dev-dependency fails here.
      - run: cargo clippy --locked -p app --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    # A hung test, such as an RT-1 test under a blocking lock, must not hold
    # the runner for GitHub's 6 h default.  The job takes about 6 minutes
    # (2026-10-26).
    timeout-minutes: 45
    env:
      # egui_kittest renders through wgpu; on a headless runner the only
      # adapter is Mesa's software Vulkan (lavapipe).  The snapshot PNGs
      # match lavapipe at egui_kittest's default threshold (harness phase 2,
      # M17).
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          # the_rustfmt_hook_formats_rust_files runs the rustfmt hook in
          # .claude/settings.json, which needs rustfmt (and jq, which the
          # runner has).
          components: rustfmt
          # a_wasm_build_reads_the_build_value in test-support compiles its
          # lib for wasm32 (VERIFY-1).
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install ALSA headers and software Vulkan (lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev mesa-vulkan-drivers libvulkan1
      # roformer-gpu's integration tests are excluded on purpose: its kernels
      # are validated against a real GPU and in-browser, never on software
      # alone (see CLAUDE.md).  The crate still gets a native compile check
      # from clippy --all-targets and a wasm compile check from the trunk
      # build below.
      - run: cargo test --locked --workspace --exclude roformer-gpu
      # --workspace merges features across crates: the default feature
      # audio of app turns on the cpal feature of engine.  This step tests
      # engine with the features of its own manifest only.
      - run: cargo test --locked -p engine
      # roformer-gpu's unit tests and doctests need no GPU.  They check every
      # shader against WebGPU's default limits with naga (GPU-1), that the
      # generated shaders are complete, that Rec keeps a buffer alive, and
      # that Gpu's device and from_device stay private (MEM-3, compile-fail
      # doctests).  mem3_lint_is_on runs here, but the clippy job proves it.
      - run: cargo test --locked -p roformer-gpu --lib
      - run: cargo test --locked -p roformer-gpu --doc
      # Stable rustdoc does not check the error code of a compile_fail
      # doctest, so a doctest that fails with another error passes.  Nightly
      # rustdoc checks it (MEM-3).  The pin keeps a new release out of CI.
      # To bump it, change DOC_NIGHTLY in xtask/src/check.rs.  Its tests then
      # name the two lines below, the line of CLAUDE.md and the test constant
      # NIGHTLY_DOC to change.
      - run: rustup toolchain install nightly-2026-10-30 --profile minimal
      - run: cargo +nightly-2026-10-30 test --locked -p roformer-gpu --doc
      # The images of a snapshot that did not match, to see what changed.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-snapshots
          path: |
            app/tests/snapshots/**/*.diff.png
            app/tests/snapshots/**/*.new.png
          if-no-files-found: ignore

  wasm-build:
    name: wasm build (trunk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-trunk
        with:
          version: ${{ env.TRUNK_VERSION }}
          sha256: ${{ env.TRUNK_SHA256 }}
      # Builds the app, the stem-worker (which compiles roformer-gpu
      # for wasm32) and the decode-worker, the same build xtask publish
      # performs.
      - run: trunk build --release
        working-directory: app

  # The browser-only behaviour, in headless Chrome: the wasm-bindgen tests
  # of browser storage, then the built app driven over WebDriver.  GPU
  # scenarios (bench, selftest, separate, worker-check) are not run: the
  # runner has no GPU, and the model weights cannot be in CI.
  browser-tests:
    name: browser tests (Chrome)
    runs-on: ubuntu-latest
    # Run 40894815433 (2026-10-29) took 18.6 minutes: `web-test` 9.6, the
    # other scenarios 4.0 and `e2e save` 3.3, after the setup.  `web-test`
    # took 7.8 minutes in run 40871041420, so it varies by about 2.  The
    # steps before `e2e save` took about 15.3 minutes in run 40894815433.
    # That was before M1, M2 and M3 of docs/plans/completed/m4a.md.  Run
    # 42777211457 (2026-11-10, after M1 and M2) took 10.5 minutes for those
    # steps, with `web-test` 5.9, and 2.8 for `e2e save`.  M3 adds about
    # 19 s to a local `web-test` of 279 s, so about 30 s on CI.  The two
    # runs differ by about 5 minutes on the same steps, as the runners
    # vary.  M4 adds two AAC saves to `e2e save`, and its limit grows from 50
    # to 60 minutes.  Run 42952206488 (2026-11-11, M2 of
    # docs/plans/active/tech-debt-rungs.md) took 19.7 minutes for the steps
    # other than `e2e save`, with `web-test` 12.0, and 3.6 for `e2e save`.
    # The limit is the limit of `e2e save` of 60, 20 for the other steps,
    # and 5 to spare.  So a run of `e2e save` that waits in vain ends on its
    # own check.  Each test binary of `web-test`
    # may take 10 minutes (xtask/src/web_test.rs), so a slow `web-test` uses
    # the spare minutes first.  A hung browser must not hold the runner for
    # GitHub's 6 h default.  `the_ci_job_limit_holds_its_save_steps`
    # (xtask/src/e2e/save.rs) checks that the limit holds the save step.
    timeout-minutes: 85
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      # Also caches ~/.cargo/bin, so wasm-bindgen-cli is built once per version.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # wasm-bindgen-test-runner must equal the wasm-bindgen in Cargo.lock.
      # xtask setup takes the version from there, and installs it only when
      # the cached one differs.
      - name: Install wasm-bindgen-test-runner at the lockfile's wasm-bindgen version
        run: cargo run --locked -p xtask -- setup wasm-bindgen-cli
      - uses: ./.github/actions/setup-trunk
        with:
          version: ${{ env.TRUNK_VERSION }}
          sha256: ${{ env.TRUNK_SHA256 }}
      # The runner image has Chrome and a matching ChromeDriver, in
      # $CHROMEWEBDRIVER, which xtask finds by itself.
      - run: cargo run --locked -p xtask -- web-test --browser chrome
      - run: trunk build --release
        working-directory: app
      - run: cargo run --locked -p xtask -- e2e smoke --browser chrome
      - run: cargo run --locked -p xtask -- e2e decode --browser chrome
      - run: cargo run --locked -p xtask -- e2e playback --browser chrome
      - run: cargo run --locked -p xtask -- e2e old-session --browser chrome
      - run: cargo run --locked -p xtask -- e2e audio-resume --browser chrome
      - run: cargo run --locked -p xtask -- e2e storage --browser chrome
      - run: cargo run --locked -p xtask -- e2e flac --browser chrome
      - run: cargo run --locked -p xtask -- e2e save --browser chrome
        # It took 3.3 minutes in run 40894815433, with the save during
        # playback of review round speed 4 of M8.  M3 of
        # docs/plans/completed/m4a.md adds two M4A saves, and M4 two AAC saves.
        # The limit is the longest
        # that all the waits of a run can take
        # (`STEP_LIMIT_S` in xtask/src/e2e/save.rs, which a test keeps equal
        # to it).  A stopped step writes no save.log, but its output has
        # every note of the run.
        timeout-minutes: 60
      # Logs and screenshots of the scenarios, to see why one failed or
      # why the job ran out of time.
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e
          # Not the generated audio (tens of MB).
          path: |
            target/e2e/**/*.log
            target/e2e/**/*.png
          if-no-files-found: ignore

  # Safari, and the real AAC encode, on a Mac (TD-92, TD-93, TD-96).
  # macos-latest is macOS 26 on arm64, with Safari 27.2, Chrome and a
  # matching ChromeDriver in $CHROMEWEBDRIVER (actions/runner-images,
  # images/macos/macos-26-arm64-Readme.md, 2026-11-02).  It is not in
  # `needs` of publish, and not a required check at first (Q6 of
  # docs/plans/active/tech-debt-rungs.md).  The GPU tests may skip here:
  # GitHub states nothing about the runner's GPU, so the job does not set
  # gpu in STEMYLA_REQUIRE.
  macos:
    name: browser tests (macOS)
    runs-on: macos-latest
    # The setup builds Trunk and wasm-bindgen-cli with `cargo install`,
    # and the crates for wasm32.  In run 43108510738 (2026-11-11), with no
    # cache, the job took 50.9 minutes.  The setup took 17.0, the Safari
    # `web-test` 15.6, the AAC step 0.5, and the two `e2e save` steps 4.7
    # and 5.2.  So the other steps took 24.8 minutes.  That is the longest
    # of the macOS jobs from 2026-11-11 to 2026-11-12.  The limit holds:
    # * the two `e2e save` steps at their limits: 120 minutes;
    # * the two retry steps (TD-98): 3 attempts of 30 and of 15 minutes,
    #   and a wait of 10 s after each failed attempt: 136 minutes;
    # * 25 minutes for the other steps.
    # That is 281 minutes, and 4 to spare.  A hung browser must not hold
    # the runner for GitHub's 6 h default.
    # `the_ci_job_limit_holds_its_save_steps` (xtask/src/e2e/save.rs)
    # checks that the limit holds the save and retry steps.
    timeout-minutes: 285
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      # Also caches ~/.cargo/bin, so Trunk and wasm-bindgen-cli are built
      # once per version.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The action setup-trunk takes the Linux release tarball only, so
      # Trunk comes from `cargo install --locked` at its pin (BUILD-1).
      - name: Install the wasm32 target, Trunk and wasm-bindgen-test-runner at their pins
        run: cargo run --locked -p xtask -- setup wasm32 trunk wasm-bindgen-cli
      - name: Turn on Safari's WebDriver
        run: sudo safaridriver --enable
      # TD-98: on the macOS runner, `wasm-bindgen-test-runner` sometimes
      # waits its 600 s limit for a test page that never reports, in Safari
      # and in Chrome.  `web-test` then exits with 75 when each failed crate
      # failed only by that hang (`exit_code` in xtask/src/web_test.rs).
      # Each other failure exits with 1, and the step fails at once.  So
      # each `web-test` step runs up to 3 times on exit code 75 only, and
      # each retry shows a warning.  An attempt that reaches
      # `timeout_minutes` is not retried.  With no hang, an attempt took
      # 15.6 minutes at most (run 43108510738, with no cache).  A hang adds
      # the runner's limit of 10 minutes.  So 30 minutes hold an attempt
      # with one hang, and 4.4 to spare.
      - name: The Safari web-test, run again only after the runner's hang (TD-98)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          command: cargo run --locked -p xtask -- web-test --browser safari
          max_attempts: 3
          timeout_minutes: 30
          retry_on_exit_code: 75
          warning_on_retry: true
      - run: trunk build --release
        working-directory: app
      - run: cargo run --locked -p xtask -- e2e smoke --browser safari
      - run: cargo run --locked -p xtask -- e2e decode --browser safari
      - run: cargo run --locked -p xtask -- e2e playback --browser safari
      - run: cargo run --locked -p xtask -- e2e old-session --browser safari
      - run: cargo run --locked -p xtask -- e2e audio-resume --browser safari
      - run: cargo run --locked -p xtask -- e2e storage --browser safari
      - run: cargo run --locked -p xtask -- e2e flac --browser safari
      - run: cargo run --locked -p xtask -- e2e save --browser safari
        # The same limit as the Linux step, for the same waits.
        timeout-minutes: 60
      # Chrome on macOS has an AAC encoder, and Chrome on Linux has none
      # (TD-92).  STEMYLA_REQUIRE=aac makes the test fail, not skip, with
      # no encoder.  Only this step sets it.
      # Run again only after the runner's hang, as the Safari web-test is
      # (TD-98).  With no hang, an attempt took 1.7 minutes at most (run
      # 42991255256).  An attempt with a hang took 10.5 (run 43229036261,
      # attempt 2).  So 15 minutes hold an attempt with one hang, and 3.3
      # to spare.
      - name: The real AAC encode, in Chrome, run again only after the runner's hang (TD-98)
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          command: cargo run --locked -p xtask -- web-test --browser chrome a_real_aac_decodes_to_the_source
          max_attempts: 3
          timeout_minutes: 15
          retry_on_exit_code: 75
          warning_on_retry: true
        env:
          STEMYLA_REQUIRE: aac
      - run: cargo run --locked -p xtask -- e2e save --browser chrome
        # The same limit as the Linux step, for the same waits.
        timeout-minutes: 60
      - if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-macos
          # Not the generated audio (tens of MB).
          path: |
            target/e2e/**/*.log
            target/e2e/**/*.png
          if-no-files-found: ignore

  publish:
    name: publish to gh-pages
    needs: [fmt, clippy, test, wasm-build, browser-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep the GITHUB_TOKEN wired into the origin remote so xtask can
          # fetch and push the gh-pages branch.
          persist-credentials: true
          # Full history: --skip-if-behind compares commits of main, and
          # write-once looks for earlier publishes in gh-pages' history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: ./.github/actions/setup-trunk
        with:
          version: ${{ env.TRUNK_VERSION }}
          sha256: ${{ env.TRUNK_SHA256 }}
      - name: Identity for the publish commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # xtask publish builds the app for /stemyla/ with trunk, verifies the
      # output, commits it as the whole gh-pages tree and pushes.  Built in
      # debug: it only orchestrates git and trunk, so optimising it is waste.
      # --skip-if-behind main: publishes the tip of main, or an older commit
      # of main only while the site has nothing newer, so re-running an old
      # run cannot roll the site back.
      - run: cargo run --locked -p xtask -- publish --skip-if-behind main
